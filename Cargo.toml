[workspace]
resolver = "2"
members = [
    "crates/nf-cli",
    "crates/nf-shell",
    "crates/nf-engine",
    "crates/nf-runtime",
    "crates/nf-source",
    "crates/videocut-core",
    "crates/videocut-download",
    "crates/videocut-transcribe",
    "crates/videocut-align",
    "crates/videocut-cut",
    "crates/nf-tts",
    "crates/nf-guide",
    "crates/nf-shell-mac",
    "crates/nf-recorder",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/ChaosRealmsAI/NextFrame"
authors = ["NextFrame Contributors"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
wildcard_imports = "deny"

[workspace.dependencies]
wry = "0.55"
tao = "0.35"
interprocess = { version = "2.4", features = ["tokio"] }
ctrlc = { version = "3", features = ["termination"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
clap = { version = "4", features = ["derive", "cargo"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
directories = "6"
once_cell = "1"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
