[workspace]
resolver = "2"
members = [
    "crates/nf-cli",
    "crates/nf-shell",
    "crates/nf-engine",
    "crates/nf-runtime",
    "crates/nf-source",
    "crates/videocut-core",
    "crates/videocut-download",
    "crates/videocut-transcribe",
    "crates/videocut-align",
    "crates/videocut-cut",
    "crates/nf-tts",
    "crates/nf-guide",
    "crates/nf-shell-mac",
    "crates/nf-recorder",
    "crates/nf-agent",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.86"
license = "MIT"
repository = "https://github.com/ChaosRealmsAI/NextFrame"
authors = ["NextFrame Contributors"]

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
wildcard_imports = "deny"

[workspace.dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
