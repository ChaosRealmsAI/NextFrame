<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Dashboard · All HTML Outputs</title>
<style>
  :root {
    --bg: #0a0912;
    --panel: rgba(20, 16, 35, 0.85);
    --panel-hover: rgba(40, 30, 65, 0.9);
    --border: rgba(255, 255, 255, 0.12);
    --border-active: rgba(167, 139, 250, 0.45);
    --text: rgba(255, 255, 255, 0.94);
    --text-sub: rgba(255, 255, 255, 0.62);
    --text-mute: rgba(255, 255, 255, 0.42);
    --accent: #a78bfa;
    --accent-bg: rgba(167, 139, 250, 0.12);
    --green: #34d399;
    --warm: #f97316;
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
    --font-mono: 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace;
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; display: flex; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(ellipse 80% 25% at 50% 0%, rgba(139,92,246,0.18) 0%, transparent 60%), radial-gradient(ellipse 40% 15% at 20% 100%, rgba(249,115,22,0.08) 0%, transparent 60%); }

  /* ── Sidebar ── */
  .sidebar {
    width: 320px; flex-shrink: 0;
    background: var(--panel);
    backdrop-filter: blur(40px) saturate(1.8);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    height: 100vh;
    position: relative;
    z-index: 1;
  }
  .sb-inner { padding: 24px 20px; }

  .brand {
    display: flex; align-items: center; gap: 10px;
    font-family: var(--font-mono); font-size: 12px;
    color: var(--accent);
    letter-spacing: 0.08em; text-transform: uppercase;
    margin-bottom: 4px;
  }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }

  h1.title { font-size: 20px; font-weight: 800; color: var(--text); margin: 0 0 16px; line-height: 1.3; letter-spacing: -0.01em; }
  .sub-count { font-size: 12px; color: var(--text-mute); font-family: var(--font-mono); margin-bottom: 20px; letter-spacing: 0.04em; }

  .version-head {
    margin: 20px 0 8px;
    font-family: var(--font-mono); font-size: 11px;
    color: var(--text-mute);
    letter-spacing: 0.1em; text-transform: uppercase;
    display: flex; align-items: center; gap: 10px;
  }
  .version-head b { color: var(--accent); font-size: 14px; font-weight: 700; }

  .item {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 11px 14px;
    margin-bottom: 4px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.12s, border-color 0.12s;
    text-align: left;
    background: transparent;
    color: inherit;
    font-family: inherit;
    width: 100%;
  }
  .item:hover { background: rgba(255, 255, 255, 0.04); border-color: var(--border); }
  .item.active { background: var(--accent-bg); border-color: var(--border-active); }
  .item.active .item-title { color: var(--accent); }

  .item-icon { font-size: 20px; line-height: 1; flex-shrink: 0; margin-top: 1px; }
  .item-body { flex: 1; min-width: 0; }
  .item-title { font-size: 14px; font-weight: 600; color: var(--text); line-height: 1.3; margin-bottom: 3px; }
  .item-sub { font-size: 12px; color: var(--text-sub); line-height: 1.4; }
  .item-meta { font-family: var(--font-mono); font-size: 10px; color: var(--text-mute); letter-spacing: 0.03em; margin-top: 4px; }

  .empty-hint {
    margin-top: 32px; padding: 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px dashed var(--border);
    border-radius: 10px;
    font-size: 13px; color: var(--text-sub);
    line-height: 1.55;
  }
  .empty-hint code { font-family: var(--font-mono); font-size: 11.5px; background: rgba(255, 255, 255, 0.06); padding: 1px 5px; border-radius: 3px; color: var(--accent); }

  /* ── Main iframe area ── */
  .main { flex: 1; height: 100vh; position: relative; background: #000; display: flex; flex-direction: column; z-index: 1; }
  .main-bar { display: flex; align-items: center; gap: 12px; padding: 10px 18px; background: var(--panel); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); font-family: var(--font-mono); font-size: 12px; color: var(--text-sub); }
  .main-bar .path { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
  .main-bar .open-link { color: var(--accent); text-decoration: none; padding: 4px 10px; border: 1px solid var(--border-active); border-radius: 5px; font-size: 11px; letter-spacing: 0.04em; }
  .main-bar .open-link:hover { background: var(--accent-bg); }
  .main-iframe { flex: 1; width: 100%; border: 0; background: #0a0912; }
  .main-empty { flex: 1; display: grid; place-items: center; color: var(--text-sub); text-align: center; padding: 40px; }
  .main-empty h2 { color: var(--text); margin: 0 0 12px; font-weight: 800; }
  .main-empty p { margin: 6px 0; font-size: 14px; line-height: 1.6; }
  .main-empty code { font-family: var(--font-mono); font-size: 12px; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; color: var(--accent); }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="sb-inner">
    <div class="brand"><span class="dot"></span> Dashboard · All HTML</div>
    <h1 class="title">全部 HTML 产出<br>按版本分组</h1>
    <div class="sub-count" id="count">loading…</div>
    <div id="entries"></div>
  </div>
</aside>

<main class="main">
  <div class="main-bar">
    <span class="path" id="path">点左侧项目查看</span>
    <a class="open-link" id="open-link" href="#" target="_blank" style="display:none;">🔗 new tab</a>
  </div>
  <div class="main-empty" id="empty">
    <div>
      <h2>还没有 HTML 产出</h2>
      <p>第一个 HTML 产出后<br>会自动注册到 <code>html-registry.json</code><br>并显示在左侧</p>
    </div>
  </div>
  <iframe class="main-iframe" id="iframe" src="about:blank" style="display:none;"></iframe>
</main>

<script>
  const ICONS = {
    brief: '📋', prototype: '🎬', plan: '🗺️',
    architecture: '🏛️', walkthrough: '🎞️',
    'verify-report': '✅', verify: '✅',
    retro: '📝', 'pm-docs': '📖',
    other: '📄'
  };

  const iframe = document.getElementById('iframe');
  const emptyEl = document.getElementById('empty');
  const entriesEl = document.getElementById('entries');
  const pathEl = document.getElementById('path');
  const openLink = document.getElementById('open-link');
  const countEl = document.getElementById('count');

  function select(btn, entry) {
    document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
    btn.classList.add('active');
    iframe.src = entry.path;
    iframe.style.display = 'block';
    emptyEl.style.display = 'none';
    pathEl.textContent = entry.path;
    openLink.href = entry.path;
    openLink.style.display = 'inline-block';
  }

  async function load() {
    let registry;
    try {
      const res = await fetch('html-registry.json');
      registry = await res.json();
    } catch (e) {
      countEl.textContent = 'html-registry.json 读取失败';
      return;
    }

    const entries = registry.entries || [];
    countEl.textContent = `${entries.length} HTML · ${new Set(entries.map(e => e.version || 'misc')).size} 组`;

    if (entries.length === 0) {
      entriesEl.innerHTML = '<div class="empty-hint">目前 registry 为空。AI 每次产 HTML 时会自动 append — 等生成第一个 HTML 再回来看。</div>';
      return;
    }

    // 按 group (or version) 分组
    const groups = {};
    for (const e of entries) {
      const g = e.group || e.version || 'other';
      if (!groups[g]) groups[g] = [];
      groups[g].push(e);
    }

    const sortedGroups = Object.keys(groups).sort();
    let firstBtn = null;
    let firstEntry = null;

    for (const g of sortedGroups) {
      const head = document.createElement('div');
      head.className = 'version-head';
      head.innerHTML = `<b>${g}</b> <span>${groups[g].length} 条</span>`;
      entriesEl.appendChild(head);

      for (const e of groups[g]) {
        const btn = document.createElement('button');
        btn.className = 'item';
        const icon = ICONS[e.type] || ICONS.other;
        btn.innerHTML = `
          <div class="item-icon">${icon}</div>
          <div class="item-body">
            <div class="item-title">${e.title || e.path.split('/').pop()}</div>
            <div class="item-sub">${e.type || ''} · ${e.path}</div>
            <div class="item-meta">${e.date || ''}</div>
          </div>`;
        btn.addEventListener('click', () => select(btn, e));
        entriesEl.appendChild(btn);

        if (!firstBtn) { firstBtn = btn; firstEntry = e; }
      }
    }

    // 默认加载第一条
    if (firstBtn) select(firstBtn, firstEntry);
  }

  load();
</script>
</body>
</html>
