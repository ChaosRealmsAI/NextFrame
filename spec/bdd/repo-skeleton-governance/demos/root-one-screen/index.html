<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>BDD · root one screen</title>
<style>
  body{margin:0;background:#101318;color:#edf2f7;font:15px/1.5 system-ui,sans-serif}
  .stage{height:100vh;display:grid;place-items:center}
  .panel{width:min(860px,86vw)}
  h1{margin:0 0 18px;font-size:28px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .item{padding:14px;border:1px solid #394150;background:#171c24}
  .bad{animation:fade 8s infinite;color:#fb7185}.good{animation:pop 8s infinite;color:#7dd3fc}
  .bar{height:5px;background:#334155;margin-top:28px;overflow:hidden}.bar i{display:block;height:100%;background:#7dd3fc;animation:run 8s linear infinite}
  .toast{margin-top:14px;color:#86efac;opacity:0;animation:done 8s infinite}
  @keyframes run{from{width:0}to{width:100%}}@keyframes fade{50%,100%{opacity:.25}}@keyframes pop{0%,35%{transform:scale(.96);opacity:.6}55%,100%{transform:scale(1);opacity:1}}@keyframes done{80%,100%{opacity:1}}
</style>
<body>
<main class="stage">
  <section class="panel">
    <h1>根目录从杂乱变成一屏可读</h1>
    <div class="grid">
      <div class="item good">crates/</div><div class="item good">frontend/</div><div class="item good">examples/</div>
      <div class="item good">scripts/</div><div class="item good">tests/</div><div class="item good">spec/</div>
      <div class="item bad">tmp/</div><div class="item bad">episodes/</div><div class="item bad">reference/</div>
    </div>
    <div class="bar"><i></i></div><div class="toast">本轮完成</div>
  </section>
</main>
</body>
</html>
