<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>BDD · archive boundary</title>
<style>
  body{margin:0;background:#101318;color:#edf2f7;font:15px/1.5 system-ui,sans-serif}.stage{height:100vh;display:grid;place-items:center}
  .panel{width:min(900px,86vw)}h1{margin:0 0 18px;font-size:28px}.row{display:flex;gap:10px;align-items:center}
  .chip{padding:12px 16px;background:#171c24;border:1px solid #394150;animation:move 8s infinite}.target{margin-left:auto;padding:18px 22px;border:1px solid #7dd3fc;color:#7dd3fc;background:#10202a}
  .bar{height:5px;background:#334155;margin-top:28px;overflow:hidden}.bar i{display:block;height:100%;background:#7dd3fc;animation:run 8s linear infinite}.toast{margin-top:14px;color:#86efac;opacity:0;animation:done 8s infinite}
  @keyframes run{from{width:0}to{width:100%}}@keyframes move{0%,25%{transform:translateX(0)}60%,100%{transform:translateX(130px);opacity:.55}}@keyframes done{80%,100%{opacity:1}}
</style>
<body><main class="stage"><section class="panel">
  <h1>本地产物迁到仓外归档</h1>
  <div class="row"><div class="chip">tmp/</div><div class="chip">episodes/</div><div class="chip">reference/</div><div class="target">../NextFrame.archive/</div></div>
  <div class="bar"><i></i></div><div class="toast">本轮完成</div>
</section></main></body></html>
