<!doctype html>
<html lang="zh">
<meta charset="utf-8">
<title>BDD · docs entry</title>
<style>
  body{margin:0;background:#101318;color:#edf2f7;font:15px/1.5 system-ui,sans-serif}.stage{height:100vh;display:grid;place-items:center}
  .panel{width:min(900px,86vw)}h1{margin:0 0 18px;font-size:28px}.docs{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .doc{padding:22px;border:1px solid #394150;background:#171c24}.doc b{color:#7dd3fc}.doc ul{margin:12px 0 0;padding-left:18px}
  .doc{animation:rise 8s infinite}.doc:nth-child(2){animation-delay:.5s}.bar{height:5px;background:#334155;margin-top:28px;overflow:hidden}.bar i{display:block;height:100%;background:#7dd3fc;animation:run 8s linear infinite}.toast{margin-top:14px;color:#86efac;opacity:0;animation:done 8s infinite}
  @keyframes run{from{width:0}to{width:100%}}@keyframes rise{0%,30%{transform:translateY(10px);opacity:.5}55%,100%{transform:translateY(0);opacity:1}}@keyframes done{80%,100%{opacity:1}}
</style>
<body><main class="stage"><section class="panel">
  <h1>入口文档对齐当前产品</h1>
  <div class="docs"><div class="doc"><b>README.md</b><ul><li>产品是什么</li><li>怎么运行</li><li>目录地图</li></ul></div><div class="doc"><b>CLAUDE.md</b><ul><li>AI 验证接口</li><li>边界规则</li><li>当前焦点</li></ul></div></div>
  <div class="bar"><i></i></div><div class="toast">本轮完成</div>
</section></main></body></html>
