<!DOCTYPE html>
<!--
  frame-narration · 逐帧讲解 PPT 骨架
  零依赖 · 零 TTS · 纯文字 · 左右切换

  frames.json 需被 fetch 读取. 由于 file:// fetch 受 CORS 限制,
  推荐改用 <script src> 加载 JS 版 frames.js:
    window.FRAMES = [...]  (内容同 frames.json 数组)
-->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AI 接口调研 · 6 帧</title>
<style>
:root {
  --bg: #0a0a0f;
  --bg-2: #0f0f17;
  --panel: #1a1a1f;
  --fg: #e8e8ec;
  --dim: #8a8a95;
  --muted: rgba(232,232,236,0.4);
  --accent: #a78bfa;
  --warm: #ff9a3c;
  --line: #232330;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  user-select: none;
}

/* ============ Header ============ */
.header {
  padding: 14px 32px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-2);
  flex-shrink: 0;
}
.title { font-size: 15px; font-weight: 600; color: var(--fg); }
.subtitle { font-size: 12px; color: var(--dim); }
.frame-title { color: var(--accent); font-size: 13px; font-weight: 500; }
.frame-counter {
  font-family: "SF Mono", Menlo, monospace;
  font-size: 12px;
  color: var(--muted);
}

/* ============ Main · 左 stage + 右 step 列 ============ */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* Stage · 左栏 68% */
#stage {
  flex: 0 0 68%;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 48px 60px;
  position: relative;
  border-right: 1px solid var(--line);
}

/* 右栏 · 当前帧讲解 + step 列表 */
.side-panel {
  flex: 1;
  background: var(--bg-2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.side-head {
  padding: 24px 28px 16px;
  border-bottom: 1px solid var(--line);
}
.side-head .side-label {
  font-size: 10px;
  color: var(--accent);
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 10px;
}
.side-head .side-narration {
  font-size: 17px;
  line-height: 1.65;
  color: var(--fg);
  font-weight: 400;
}

.side-steps {
  flex: 1;
  padding: 18px 20px 24px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.side-steps .step-item {
  padding: 14px 16px 14px 44px;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--line);
  border-left: 3px solid transparent;
  border-radius: 8px;
  font-size: 14px;
  color: var(--dim);
  line-height: 1.5;
  position: relative;
  transition: all 0.3s ease;
}
.side-steps .step-item::before {
  content: attr(data-num);
  position: absolute;
  left: 14px;
  top: 14px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: rgba(255,255,255,0.06);
  color: var(--dim);
  font-family: "SF Mono", Menlo, monospace;
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
}
.side-steps .step-item.done {
  opacity: 0.55;
  color: var(--dim);
  border-left-color: rgba(167,139,250,0.4);
}
.side-steps .step-item.done::before {
  background: rgba(167,139,250,0.2);
  color: var(--accent);
  content: "✓";
}
.side-steps .step-item.active {
  background: rgba(167,139,250,0.12);
  border-color: rgba(167,139,250,0.3);
  border-left-color: var(--accent);
  color: var(--fg);
  box-shadow: 0 4px 20px rgba(167,139,250,0.15);
}
.side-steps .step-item.active::before {
  background: var(--accent);
  color: #fff;
}
.side-steps .step-empty {
  padding: 32px 16px;
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  font-style: italic;
}

#stage .stage-center {
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}
#stage h1 { font-size: 56px; font-weight: 800; letter-spacing: -0.03em; margin: 0; color: var(--fg); line-height: 1.05; }
#stage h2 { font-size: 36px; font-weight: 700; margin: 0; color: var(--fg); }
#stage p { font-size: 20px; color: var(--dim); margin: 0; line-height: 1.5; }

#stage .layout-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 48px;
  width: 100%;
}
#stage .layout-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

#stage .big-block {
  width: 220px;
  height: 220px;
  border-radius: 18px;
  background: var(--panel);
  border: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 72px;
  transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
  position: relative;
}
#stage .big-arrow {
  font-size: 48px;
  color: var(--accent);
  transition: all 0.4s ease;
}

/* ============ 状态类 · 聚焦不降暗 ============ */
#stage [data-id].dim { opacity: 0.35; }
#stage [data-id].bright {
  opacity: 1;
  box-shadow: 0 0 0 2px var(--accent), 0 0 32px rgba(167,139,250,0.35);
}
#stage [data-id].zoomed { transform: scale(1.12); }
#stage [data-id].focused {
  filter: drop-shadow(0 0 24px rgba(167,139,250,0.85)) brightness(1.15);
}

#stage [data-animate="pulse"] { animation: pulse 0.8s ease; }
#stage [data-animate="shake"] { animation: shake 0.5s ease; }
#stage [data-animate="zoom-in"] { animation: zoom-in 0.4s ease; }

@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes zoom-in { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

/* ============ Control Bar ============ */
.control-bar {
  height: 64px;
  min-height: 64px;
  padding: 0 32px;
  background: var(--bg-2);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 14px;
  flex-shrink: 0;
}
.control-bar button {
  background: rgba(167, 139, 250, 0.15);
  color: var(--accent);
  border: 1px solid rgba(167, 139, 250, 0.3);
  border-radius: 8px;
  padding: 10px 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: background 0.15s;
}
.control-bar button:hover { background: rgba(167, 139, 250, 0.28); }
.control-bar button:disabled { opacity: 0.3; cursor: not-allowed; }

.control-bar .step-btn {
  background: var(--accent);
  color: white;
  padding: 10px 24px;
  border-color: var(--accent);
  font-size: 15px;
}
.control-bar .step-btn:hover { background: #8b5cf6; }
.control-bar .step-btn:disabled { opacity: 0.3; }

.progress-dots {
  display: flex;
  gap: 6px;
  margin: 0 14px;
}
.progress-dots .dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,0.1);
  transition: all 0.3s;
}
.progress-dots .dot.active { background: var(--accent); transform: scale(1.4); }
.progress-dots .dot.done { background: rgba(167,139,250,0.4); }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="title">Frame Narration</div>
    <div class="subtitle">← → 上/下一步 · 空格下一步 · R 重头</div>
  </div>
  <div style="text-align: right;">
    <div class="frame-title" id="frameTitle">—</div>
    <div class="frame-counter" id="frameCounter">- / -</div>
  </div>
</div>

<div class="main">
  <div id="stage"></div>
  <aside class="side-panel">
    <div class="side-head">
      <div class="side-label">THIS FRAME</div>
      <div class="side-narration" id="narration">—</div>
    </div>
    <div class="side-steps" id="sideSteps"></div>
  </aside>
</div>

<div class="control-bar">
  <button id="prevBtn">← 上一步</button>
  <button id="nextBtn" class="step-btn">下一步 →</button>
  <div class="progress-dots" id="dots"></div>
</div>

<!-- ============ frames.js ============
  作者自己写 (或 frames.json 转 JS):
    window.FRAMES = [{id, title, narration, visual_html, reveal_steps?}, ...]
-->
<script src="research-ai-interfaces-frames.js"></script>

<script>
(function() {
  const FRAMES = window.FRAMES || [];
  if (FRAMES.length === 0) {
    document.getElementById('stage').innerHTML = '<div style="color:#8a8a95">⚠️ frames.js 为空 · 先写 window.FRAMES = [...]</div>';
    return;
  }

  const stage = document.getElementById('stage');
  const frameTitle = document.getElementById('frameTitle');
  const frameCounter = document.getElementById('frameCounter');
  const narration = document.getElementById('narration');
  const sideSteps = document.getElementById('sideSteps');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const dots = document.getElementById('dots');

  // 展平成 unit 序列:每 frame 的"初始" + 每个 reveal_step 各一 unit
  // unit = { frameIdx, revealIdx }  revealIdx=0 表示未应用任何 reveal · 1..N 表示已应用前 N 个
  const units = [];
  FRAMES.forEach((f, fi) => {
    const n = (f.reveal_steps || []).length;
    for (let r = 0; r <= n; r++) units.push({ frameIdx: fi, revealIdx: r });
  });

  let pos = 0;              // 当前 unit index
  let renderedFrameIdx = -1; // 当前 stage 渲染的 frame · 切 frame 才重建 DOM

  function buildDots() {
    dots.innerHTML = '';
    const curFrame = units[pos].frameIdx;
    FRAMES.forEach((_, i) => {
      const d = document.createElement('div');
      d.className = 'dot';
      if (i < curFrame) d.classList.add('done');
      else if (i === curFrame) d.classList.add('active');
      d.addEventListener('click', () => {
        // 跳到该 frame 的第一个 unit (revealIdx=0)
        const target = units.findIndex(u => u.frameIdx === i);
        if (target >= 0) { pos = target; render(); }
      });
      dots.appendChild(d);
    });
  }

  function renderStageFor(frameIdx) {
    const f = FRAMES[frameIdx];
    stage.innerHTML = f.visual_html;
    frameTitle.textContent = f.title || '';
    narration.textContent = f.narration || '';
    buildSideSteps(f);
    renderedFrameIdx = frameIdx;
  }

  function applyRevealsUpTo(frameIdx, revealIdx) {
    const steps = (FRAMES[frameIdx].reveal_steps || []).slice(0, revealIdx);
    steps.forEach(op => applyOp(op, { skipAnimate: true }));
  }

  function render() {
    const u = units[pos];
    // 切 frame → 重建 stage + 重放前 revealIdx 个 reveal (瞬间 · 不动画)
    if (u.frameIdx !== renderedFrameIdx) {
      renderStageFor(u.frameIdx);
      applyRevealsUpTo(u.frameIdx, u.revealIdx);
    }
    frameCounter.textContent = `${pos + 1} / ${units.length}`;
    prevBtn.disabled = (pos === 0);
    nextBtn.disabled = (pos === units.length - 1);
    nextBtn.textContent = pos === units.length - 1 ? '✓ 讲完' : '下一步 →';
    updateSideStepsState();
    buildDots();
  }

  function buildSideSteps(f) {
    const steps = f.reveal_steps || [];
    sideSteps.innerHTML = '';
    if (steps.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'step-empty';
      empty.textContent = '这一帧无分步 · 直接看画面 · → 下一步';
      sideSteps.appendChild(empty);
      return;
    }
    steps.forEach((s, i) => {
      const el = document.createElement('div');
      el.className = 'step-item';
      el.setAttribute('data-num', i + 1);
      el.textContent = s.label || s.desc || describeOp(s);
      sideSteps.appendChild(el);
    });
  }

  function describeOp(op) {
    const t = op.target || '?';
    if (op.animate) return `${t} · ${op.animate} 动画`;
    if (op.add && op.remove) return `${t} · ${op.remove} → ${op.add}`;
    if (op.add) return `${t} · 高亮(${op.add})`;
    if (op.remove) return `${t} · 撤 ${op.remove}`;
    return `${t}`;
  }

  function updateSideStepsState() {
    const u = units[pos];
    const items = sideSteps.querySelectorAll('.step-item');
    items.forEach((el, i) => {
      el.classList.remove('done', 'active');
      // revealIdx=0 → 无 active · revealIdx=1 → 第 0 个 active · >=2 → 前 n-1 done · 第 n-1 active
      if (u.revealIdx === 0) return;
      if (i < u.revealIdx - 1) el.classList.add('done');
      else if (i === u.revealIdx - 1) el.classList.add('active');
    });
  }

  function applyOp(op, opts) {
    const el = stage.querySelector(`[data-id="${op.target}"]`);
    if (!el) return;
    if (op.add) op.add.split(' ').forEach(c => el.classList.add(c));
    if (op.remove) op.remove.split(' ').forEach(c => el.classList.remove(c));
    if (op.animate && !(opts && opts.skipAnimate)) {
      el.setAttribute('data-animate', op.animate);
      setTimeout(() => el.removeAttribute('data-animate'), 1000);
    }
  }

  function goNext() {
    if (pos >= units.length - 1) return;
    const cur = units[pos];
    const nxt = units[pos + 1];
    pos++;
    // 同 frame 前进一步 = 应用下一个 reveal (带动画)
    if (cur.frameIdx === nxt.frameIdx) {
      const op = FRAMES[cur.frameIdx].reveal_steps[cur.revealIdx];
      applyOp(op);
      frameCounter.textContent = `${pos + 1} / ${units.length}`;
      prevBtn.disabled = false;
      nextBtn.disabled = (pos === units.length - 1);
      nextBtn.textContent = pos === units.length - 1 ? '✓ 讲完' : '下一步 →';
      updateSideStepsState();
    } else {
      // 换 frame · 整体重绘
      render();
    }
  }

  function goPrev() {
    if (pos <= 0) return;
    const cur = units[pos];
    const prv = units[pos - 1];
    pos--;
    // 同 frame 后退一步 = 撤销当前 reveal (重新 build 再 apply 前 N-1 个 · 保证逆向状态干净)
    if (cur.frameIdx === prv.frameIdx) {
      renderStageFor(cur.frameIdx);
      applyRevealsUpTo(cur.frameIdx, prv.revealIdx);
      frameCounter.textContent = `${pos + 1} / ${units.length}`;
      prevBtn.disabled = (pos === 0);
      nextBtn.disabled = false;
      nextBtn.textContent = '下一步 →';
      updateSideStepsState();
      buildDots();
    } else {
      render();
    }
  }

  function reset() {
    pos = 0;
    renderedFrameIdx = -1;
    render();
  }

  prevBtn.onclick = goPrev;
  nextBtn.onclick = goNext;

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goNext(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
    else if (e.key === 'r' || e.key === 'R') reset();
  });

  render();
})();
</script>
</body>
</html>
