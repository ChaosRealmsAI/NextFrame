[package]
name = "poc-tao-ipc"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
ctrlc = { version = "3.4", features = ["termination"] }
interprocess = "=2.2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.27"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "io-util", "net", "time", "sync"] }

[[bin]]
name = "poc-tao-ipc"
path = "src/main.rs"

[[bin]]
name = "ipc-client"
path = "src/ipc_client.rs"
