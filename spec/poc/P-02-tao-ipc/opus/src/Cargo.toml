[workspace]

[package]
name = "poc-tao-ipc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "poc-tao-ipc"
path = "src/main.rs"

[[bin]]
name = "ipc-client"
path = "src/bin/ipc_client.rs"

[dependencies]
tao = "0.30"
interprocess = { version = "2.2", features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = { version = "3", features = ["termination"] }

[profile.dev]
opt-level = 0
debug = 1

[profile.release]
opt-level = 3
lto = false
