[package]
name = "poc-wry-glass"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"

[workspace]

[dependencies]
serde_json = "1.0"
tao = "0.35.0"
wry = { version = "0.55.0", features = ["transparent"] }

[[bin]]
name = "baseline-open"
path = "src/bin/baseline-open.rs"

[[bin]]
name = "wry-default"
path = "src/bin/wry-default.rs"

[[bin]]
name = "wry-transparent"
path = "src/bin/wry-transparent.rs"
