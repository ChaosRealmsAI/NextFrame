[package]
name = "nf-shell"
version = "0.1.0"
edition.workspace = true

[[bin]]
name = "nf-shell"
path = "src/main.rs"

[dependencies]
wry = "0.45"
tao = "0.30"
rfd = "0.14"
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt", "macros"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
# v1.44 · runtime 驱动 export · 替换 v1.22 的 ffmpeg avfoundation 路径(ADR-064)
nf-recorder = { path = "../nf-recorder" }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.33"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
cairo-rs = { version = "0.18", features = ["png"] }
gtk = "0.18"
javascriptcore-rs = "1"
webkit2gtk = { version = "2", features = ["v2_40"] }

[package.metadata.bundle]
name = "NextFrame"
identifier = "com.nextframe.app"
category = "public.app-category.video"
short_description = "AI 视频引擎 · JSON 进，视频出"
long_description = "NextFrame 把结构化的 JSON 时间线变成可播放的视频 —— 教育 / 产品演示 / 数据报告 / 培训 / 开源项目都能用"
copyright = "© 2026 NextFrame"
osx_minimum_system_version = "11.0"

[lints]
workspace = true
