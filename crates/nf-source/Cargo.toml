[package]
name = "nf-source"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "nf-source"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde_json = "1.0"
videocut-core = { path = "../videocut-core" }
videocut-download = { path = "../videocut-download" }
videocut-transcribe = { path = "../videocut-transcribe" }
videocut-align = { path = "../videocut-align" }
videocut-cut = { path = "../videocut-cut" }

[dev-dependencies]
tempfile = "3.15"

[lints]
workspace = true
